<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <title>relay — baton</title>
  <rect width="256" height="256" rx="56" fill="#0F172A"/>
  <!-- baton, rotated 45deg, passed between two hands implied by the two end caps -->
  <g transform="rotate(-30 128 128)">
    <rect x="56" y="116" width="144" height="24" rx="12" fill="#E2E8F0"/>
    <circle cx="56" cy="128" r="18" fill="#38BDF8"/>
    <circle cx="200" cy="128" r="18" fill="#38BDF8"/>
  </g>
  <!-- motion lines -->
  <path d="M40 180 L72 180" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M52 200 L92 200" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
</svg>
