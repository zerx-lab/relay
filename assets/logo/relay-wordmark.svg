<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" fill="none">
  <title>relay — wordmark</title>
  <rect width="512" height="256" rx="32" fill="#0F172A"/>
  <!-- "relay" set in a geometric sans, drawn as paths so it doesn't depend on system fonts -->
  <!-- using simple letter constructions on a 160px cap height baseline at y=192 -->
  <g fill="#E2E8F0">
    <!-- r -->
    <rect x="64" y="112" width="16" height="80" rx="4"/>
    <path d="M80 128 Q80 112 96 112 L112 112 L112 128 L96 128 Q96 128 96 144 L80 144 Z"/>
    <!-- e -->
    <path d="M128 152 A24 24 0 1 1 176 152 L176 160 L144 160 A12 12 0 0 0 168 168 L176 168 L176 184 A24 24 0 0 1 128 184 Z M144 144 L160 144 A8 8 0 0 0 144 144 Z"/>
    <!-- l -->
    <rect x="192" y="80" width="16" height="112" rx="4"/>
    <!-- a -->
    <path d="M224 152 A24 24 0 1 1 272 152 L272 192 L256 192 L256 184 A20 20 0 0 1 224 168 Z M240 168 A8 8 0 1 0 256 168 A8 8 0 1 0 240 168 Z"/>
    <!-- y -->
    <path d="M288 112 L304 112 L312 152 L320 112 L336 112 L320 184 Q316 200 300 200 L292 200 L292 184 L300 184 L304 172 Z"/>
  </g>
  <!-- accent dot after wordmark, signaling "live" relay -->
  <circle cx="356" cy="184" r="8" fill="#38BDF8"/>
</svg>
